# Example RBAC policy, loaded with rbacyaml.LoadPolicy.
#
# Permissions are colon-separated. A "*" segment matches exactly one segment
# ("posts:*" matches "posts:read" but not "posts" or "posts:drafts:read"),
# and a "**" segment matches zero or more ("posts:**" matches all three).
roles:
  viewer:
    permissions:
      - "posts:read"
      - "comments:read"
  author:
    inherits: [viewer]
    permissions:
      - "posts:create"
      - "comments:create"
  editor:
    inherits: [author]
    permissions:
      - "posts:*"
      - "comments:*"
  admin:
    inherits: [editor]
    permissions:
      - "users:*"
